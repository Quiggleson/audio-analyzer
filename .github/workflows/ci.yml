name: CI

on:
  push:
  pull_request:
  schedule:
    # Weekly, so the project is re-proven even when nobody is working on it.
    - cron: "17 5 * * 1"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
